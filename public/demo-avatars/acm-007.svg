    <circle cx="74" cy="55" r="2.8" fill="#0f172a" />
    <circle cx="53" cy="54" r="0.8" fill="#ffffff" />
    <circle cx="73" cy="54" r="0.8" fill="#ffffff" />

    <!-- Nose -->
    <path d="M63 56 Q64 63, 62 64 L66 64" stroke="#dfbca2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

