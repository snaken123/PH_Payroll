    <circle cx="80" cy="62" r="3" fill="#f43f5e" opacity="0.25" />

    <!-- Hair Overlay -->
    
        <!-- High ponytail -->
        <path d="M76 28 C86 18, 96 22, 94 36 C92 44, 86 46, 80 40 Z" fill="#262626" />
        <path d="M38 48 C38 27, 90 27, 90 48 C90 35, 78 30, 64 30 C50 30, 38 35, 38 48 Z" fill="#262626" />
      

