<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_acm-001_svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="64" cy="64" r="64" />
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Vibrant Background -->
    <rect width="128" height="128" fill="url(#bg_acm-001_svg)" />

    <!-- Torso / Shoulders -->
    <path d="M22 128 C22 96, 42 90, 64 90 C86 90, 106 96, 106 128 Z" fill="#0f172a" />

    <!-- Shirt / Collar -->
    <polygon points="56,88 64,102 72,88" fill="#ffffff" />
    <path d="M52 86 L64 100 L56 94 Z" fill="#e2e8f0" />
    <path d="M76 86 L64 100 L72 94 Z" fill="#cbd5e1" />

    <!-- Neck & Shadow -->
    <rect x="56" y="70" width="16" height="20" rx="3" fill="#e2b899" />
    <rect x="57" y="72" width="14" height="18" rx="2" fill="#f5d0b5" />

    <!-- Head / Face -->
    <ellipse cx="64" cy="58" rx="22" ry="24" fill="#f5d0b5" />

    <!-- Ears -->
    <ellipse cx="41" cy="59" rx="3.5" ry="6" fill="#f5d0b5" />
    <ellipse cx="87" cy="59" rx="3.5" ry="6" fill="#f5d0b5" />
    <ellipse cx="41" cy="59" rx="1.5" ry="3" fill="#e2b899" />
    <ellipse cx="87" cy="59" rx="1.5" ry="3" fill="#e2b899" />

    <!-- Eyebrows -->
    <path d="M49 48 Q54 46, 59 48" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M69 48 Q74 46, 79 48" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Eyes -->
    <circle cx="54" cy="55" r="2.8" fill="#0f172a" />
    <circle cx="74" cy="55" r="2.8" fill="#0f172a" />
    <circle cx="53" cy="54" r="0.8" fill="#ffffff" />
    <circle cx="73" cy="54" r="0.8" fill="#ffffff" />

    <!-- Nose -->
    <path d="M63 56 Q64 63, 62 64 L66 64" stroke="#e2b899" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Smile / Lips -->
    <path d="M57 69 Q64 74, 71 69" stroke="#b91c1c" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Cheeks blush -->
    <circle cx="48" cy="62" r="3" fill="#f43f5e" opacity="0.25" />
    <circle cx="80" cy="62" r="3" fill="#f43f5e" opacity="0.25" />

    <!-- Hair Overlay -->
    
        <!-- Male side-part hair -->
        <path d="M42 46 C42 26, 86 26, 86 46 C86 36, 78 30, 64 30 C50 30, 42 36, 42 46 Z" fill="#1e293b" />
        <path d="M40 44 C38 52, 38 60, 42 63 C42 54, 44 48, 48 44 Z" fill="#1e293b" />
        <path d="M86 44 C88 52, 88 60, 84 63 C84 54, 82 48, 78 44 Z" fill="#1e293b" />
        <path d="M42 38 C54 32, 74 34, 85 43 C72 38, 52 38, 42 44 Z" fill="#1e293b" />
      

    <!-- Accessories (glasses, headset, tie) -->
    
      <!-- Glasses -->
      <rect x="47" y="52" width="14" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="1.8" />
      <rect x="67" y="52" width="14" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="1.8" />
      <line x1="61" y1="56" x2="67" y2="56" stroke="#0f172a" stroke-width="1.8" />
      <line x1="43" y1="55" x2="47" y2="55" stroke="#0f172a" stroke-width="1.5" />
      <line x1="81" y1="55" x2="85" y2="55" stroke="#0f172a" stroke-width="1.5" />
    
  </g>
</svg>